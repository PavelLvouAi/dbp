  # dbpusers8:
  #   image: mysql:8.0.33
  #   container_name: dbpusers8
  #   environment:
  #     - MYSQL_ALLOW_EMPTY_PASSWORD=1
  #     - MYSQL_DATABASE=${DB_USERS_CONNECTION}
  #   ports:
