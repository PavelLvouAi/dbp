  #   volumes:
  #     - 'mysql_dbpusers8:/var/lib/mysql'

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: on-failure
    volumes:
      - './:/opt/app'
      - ./docker/php/phpSettings.conf:/usr/local/etc/php-fpm.d/zzz-phpSettings.conf
    environment:
      # package-create API URL (override in .env if service runs on host)
      - PACKAGE_CREATE_URL=${PACKAGE_CREATE_URL:-http://localhost:5044/package/create}
    # depends_on:
    #   - db8
    #   - dbpusers8

  server:
    image: nginx:stable-alpine
    volumes:
      - './public/:/opt/app'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    ports:
      - '${APP_PORT}:80'
    depends_on:
      - php

  memcached:
    image: memcached:1.6-alpine
    ports:
      - '${MEMCACHED_PORT}:11211'

  rds-tunnel:
    build:
      context: .
      dockerfile: docker/rds/Dockerfile
    environment:
      AWS_PROFILE: dbp-dev
      AWS_REGION: us-west-2
      INSTANCE_ID: i-0d302fa57aacf480d
      RDS_HOST: biblebrain-contentdev-aurora-serverless-t7h8.c43uzts2g90s.us-west-2.rds.amazonaws.com
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - '3307:3306'

  rds-users-tunnel:
    build:
      context: .
      dockerfile: docker/rds/DockerUsersFile
    environment:
      AWS_PROFILE: dbp-dev
      AWS_REGION: us-west-2
      INSTANCE_ID: i-0d302fa57aacf480d
      RDS_HOST: biblebrain-dev-rds-users.cluster-c43uzts2g90s.us-west-2.rds.amazonaws.com
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - '3308:3306'

